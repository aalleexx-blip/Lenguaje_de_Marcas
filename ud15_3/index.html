<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Precios</title>
</head>
<body>
    <table style="border-collapse: collapse; text-align: center; border: 1px solid black; width: 300px;">
        <caption>Menú de Cafetería</caption>
        <tr style="background-color: lightgray;">
            <th style="border: 1px solid black;">Producto</th>
            <th style="border: 1px solid black;">Tamaño</th>
            <th style="border: 1px solid black;">Precio</th>
        </tr>
        <tr>
            <td colspan="3" style="border: 1px solid black; background-color: #d9edf7; font-weight: bold;">Cafés y Desayunos</td>
        </tr>
        <tr style="background-color: #ffffff;">
            <td rowspan="2" style="border: 1px solid black;">Café Latte</td>
            <td style="border: 1px solid black;">Pequeño</td>
            <td style="border: 1px solid black;">1,50 €</td>
        </tr>
        <tr style="background-color: #f2f2f2;">
            <td style="border: 1px solid black;">Grande</td>
            <td style="border: 1px solid black;">2,20 €</td>
        </tr>
        <tr style="background-color: #ffffff;">
            <td style="border: 1px solid black;">Té Matcha</td>
            <td style="border: 1px solid black;">Único</td>
            <td style="border: 1px solid black;">2,50 €</td>
        </tr>
        <tr style="background-color: #f2f2f2;">
            <td style="border: 1px solid black;">Tostada</td>
            <td style="border: 1px solid black;">Media</td>
            <td style="border: 1px solid black;">1,20 €</td>
        </tr>
    </table>
</body>
</html>
